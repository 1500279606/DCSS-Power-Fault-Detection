seed: 42
device: cpu
data:
  train_ratio: 0.8
  window_length: 10
  stride: 1
model:
  latent_dim: 32
  hidden_dim: 64
  history_dim: 128
  dependency_context_dim: 64
dependency:
  regimes: 3
  max_lag: 2
  top_k: 3
  ridge_alpha: 1.0
  mechanism_window: 256
  mechanism_stride: 64
training:
  epochs: 30
  batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.001
  gradient_clip: 1.0
loss:
  reconstruction: 1.0
  prediction: 1.0
  latent: 1.0
  predictive_nll: 0.1
scoring:
  covariance_regularization: 0.0001
  threshold_quantile: 0.99
tta:
  enabled: false
  learning_rate: 0.0001
  temporal_window: 5

